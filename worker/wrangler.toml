name = "cheap-smile-api"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# Preisprüfung alle 30 Minuten (Free-Plan: max. 5 Cron-Trigger pro Konto)
[triggers]
crons = ["*/30 * * * *"]

# KV-Speicher für Produkte, Preisverlauf, Shop-Urteile, Push-Abos.
# Einmalig anlegen:  npx wrangler kv namespace create DB
# und die ausgegebene id hier eintragen.
[[kv_namespaces]]
binding = "DB"
id = "HIER_KV_ID_EINTRAGEN"

[vars]
# Herkunft der App (GitHub-Pages-URL) für CORS, z. B. "https://ziege1988.github.io"
ALLOWED_ORIGIN = "*"
SUBREQUEST_BUDGET = "40"
# Absender-Kennung für Web Push (Pflichtangabe gegenüber Apple)
VAPID_SUBJECT = "https://github.com/ziege1988/Cheap-Smile"
# Google-Suchen pro Monat (SerpApi Free: 250)
SERPAPI_MONTHLY_LIMIT = "240"

# Geheimnisse (werden vom GitHub-Workflow aus den Repository-Secrets gesetzt):
#   APP_TOKEN      Zugangsschlüssel (Passwort) der App            – Pflicht
#   SERPAPI_KEY    Google-Suche über serpapi.com                  – empfohlen
#   BRAVE_API_KEY  alternative Suche                              – optional
# Web-Push-Schlüssel (VAPID) erzeugt der Worker beim ersten Start selbst.
