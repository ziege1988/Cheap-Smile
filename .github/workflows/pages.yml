name: App veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versionsnummer einsetzen
        run: |
          # Neue Version bei jedem Deployment -> iPhone-App aktualisiert sich beim nächsten Start
          sed -i "s/__VERSION__/${GITHUB_SHA}/g" app/sw.js app/app.js app/index.html app/manifest.webmanifest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
